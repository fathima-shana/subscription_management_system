{% extends "base.html" %}

{# Bare layout: error pages must render for anonymous visitors too. #}
{% block page %}
<div class="flex min-h-full items-center justify-center px-6 py-16">
  <div class="max-w-md text-center">
    <p class="text-sm font-semibold uppercase tracking-wider text-brand-600">{% block code %}{% endblock %}</p>
    <h1 class="mt-2 text-3xl font-semibold tracking-tight">{% block heading %}{% endblock %}</h1>
    <p class="mt-3 text-slate-600">{% block message %}{% endblock %}</p>
    <a href="{% url 'core:home' %}" class="mt-8 inline-block rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Back to dashboard</a>
  </div>
</div>
{% endblock %}

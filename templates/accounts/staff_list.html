{% extends "base.html" %}

{% block content %}
<div class="mb-5 flex flex-wrap items-center gap-3">
  {% url 'staff:list' as list_url %}
  {% include "partials/search_box.html" with url=list_url target="staff-results" placeholder="Search staff by name or email" %}
  <a href="{% url 'staff:create' %}" class="ml-auto rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">Add staff member</a>
</div>
<div id="staff-results">{% include "accounts/_staff_results.html" %}</div>
{% endblock %}

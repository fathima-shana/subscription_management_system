{% extends "accounts/auth_base.html" %}

{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">Check your email</h1>
<p class="mt-3 text-sm text-slate-600">
  If an account exists for that address, a password reset link is on its way.
  The link works once and expires in one hour.
</p>
<a href="{% url 'accounts:login' %}" class="mt-8 inline-block rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Back to sign in</a>
{% endblock %}

{# Needs: url (list url), target (swap container id), q, placeholder #}
<div class="relative max-w-sm flex-1">
  <svg class="pointer-events-none absolute left-3 top-2.5 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 110-15 7.5 7.5 0 010 15z"/></svg>
  <input type="search" name="q" value="{{ q }}" placeholder="{{ placeholder }}" autocomplete="off"
         hx-get="{{ url }}" hx-trigger="input changed delay:300ms, search" hx-target="#{{ target }}" hx-push-url="true"
         class="block w-full rounded-lg border border-slate-300 bg-white py-2 pl-9 pr-3 text-sm shadow-sm placeholder:text-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
</div>

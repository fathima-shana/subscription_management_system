{# Menu entries come from apps/core/navigation.py and are filtered by the user's role. #}
<div x-show="sidebar" x-cloak class="fixed inset-0 z-30 bg-slate-900/40 lg:hidden" @click="sidebar = false"></div>

<aside class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white transition-transform lg:translate-x-0"
       :class="{ 'translate-x-0': sidebar }">
  <div class="flex h-16 items-center gap-2 border-b border-slate-200 px-5">
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-sm font-bold text-white">B</span>
    <span class="text-lg font-semibold tracking-tight">Brightloop</span>
  </div>

  <nav class="space-y-1 px-3 py-4 text-sm font-medium" aria-label="Main">
    {% for item in nav_items %}
      <a href="{{ item.url }}"
         {% if item.active %}aria-current="page"{% endif %}
         class="flex items-center gap-3 rounded-lg px-3 py-2 {% if item.active %}bg-brand-50 text-brand-700{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
        <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ item.icon }}"/></svg>
        {{ item.label }}
      </a>
    {% endfor %}
  </nav>
</aside>

<header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-6 lg:px-8">
  <button type="button" class="rounded-md p-2 text-slate-500 hover:bg-slate-100 lg:hidden" @click="sidebar = true" aria-label="Open menu">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <h1 class="text-base font-semibold text-slate-900">{{ page_title|default:"Brightloop" }}</h1>
  <div class="ml-auto flex items-center gap-3 text-sm text-slate-600">
    <span class="hidden sm:inline">{{ user.get_username }}</span>
  </div>
</header>

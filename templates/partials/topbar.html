<header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-6 lg:px-8">
  <button type="button" class="rounded-md p-2 text-slate-500 hover:bg-slate-100 lg:hidden" @click="sidebar = true" aria-label="Open menu">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <h1 class="text-base font-semibold text-slate-900">{{ page_title|default:"Brightloop" }}</h1>

  <div class="ml-auto flex items-center gap-3" x-data="{ open: false }" @click.outside="open = false">
    <button type="button" @click="open = !open" class="flex items-center gap-2 rounded-lg px-2 py-1.5 hover:bg-slate-100">
      <span class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold text-brand-700">{{ user.full_name|slice:":1"|upper }}</span>
      <span class="hidden text-left text-sm leading-tight sm:block">
        <span class="block font-medium text-slate-900">{{ user.full_name }}</span>
        <span class="block text-xs capitalize text-slate-500">{{ user.role }}</span>
      </span>
    </button>
    <div x-show="open" x-cloak x-transition.origin.top.right
         class="absolute right-4 top-14 w-48 rounded-lg border border-slate-200 bg-white py-1 text-sm shadow-lg sm:right-6 lg:right-8">
      <div class="truncate px-3 py-2 text-xs text-slate-500">{{ user.email }}</div>
      <a href="{% url 'accounts:password_change' %}" class="block px-3 py-2 text-slate-700 hover:bg-slate-50">Change password</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="block w-full px-3 py-2 text-left text-slate-700 hover:bg-slate-50">Sign out</button>
      </form>
    </div>
  </div>
</header>

{# Toasts: server messages render here; JS can add more via window.toast(msg, level). #}
<div id="toast-root" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-80 flex-col gap-2">
  {% for message in messages %}
    <div class="toast pointer-events-auto rounded-lg border px-4 py-3 text-sm shadow-lg
      {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800
      {% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
      {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
      {% else %}border-slate-200 bg-white text-slate-800{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
</div>
